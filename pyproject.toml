[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-trade-adapter"
version = "1.0.0a0"
description = "Self-hosted trading adapter for Binance and Bybit with universal signal protocol"
requires-python = ">=3.11"
authors = [{ name = "nms6277" }]
readme = "README.md"
license = { text = "Proprietary" }

# Core embedded-mode runtime (decision A3 / A3b). Keep minimal: a heatmap-sdk-class
# consumer that only wants `import uta` should NOT pull FastAPI / Redis / Pydantic.
# Anything used purely by the optional gateway (HTTP server, Bearer-token plumbing,
# CLI, Prometheus exposition, multi-process pub/sub) lives in extras below.
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Optional FastAPI gateway for remote / cross-language consumers (A3 gateway mode).
# Pulled in only when the operator opts into running the HTTP+WS facade.
gateway = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "click>=8.1",
    "prometheus-client>=0.20",
]
# Reserved for the future "shared bus across processes" mode (D.10 + multiproc note
# in spec). Not used by v1.0 single-process default; stays here so consumers can
# opt in with `pip install universal-trade-adapter[multiproc]` once it ships.
multiproc = [
    "redis>=5.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
uta = "trade_adapter.cli:main"

[tool.setuptools.packages.find]
include = ["trade_adapter*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
