[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-trade-adapter"
version = "1.0.0a0"
description = "Self-hosted trading adapter for Binance and Bybit with universal signal protocol"
requires-python = ">=3.11"
authors = [{ name = "nms6277" }]
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "pydantic>=2.6",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
uta = "trade_adapter.cli:main"

[tool.setuptools.packages.find]
include = ["trade_adapter*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
